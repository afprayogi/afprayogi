<svg width="100%" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f8"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgGradL)" stroke="#d0d7de" stroke-width="1"/>

  <!-- circuit traces (decorative) -->
  <g stroke="#9a6700" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 620 34 L 690 34 L 690 76 L 760 76 L 760 130 L 830 130"/>
    <path d="M 560 190 L 560 150 L 640 150 L 640 110 L 700 110"/>
    <path d="M 840 40 L 800 40 L 800 90"/>
  </g>
  <g fill="#9a6700" opacity="0.5">
    <circle cx="690" cy="34" r="2.5"/>
    <circle cx="760" cy="76" r="2.5"/>
    <circle cx="830" cy="130" r="2.5"/>
    <circle cx="640" cy="150" r="2.5"/>
    <circle cx="700" cy="110" r="2.5"/>
    <circle cx="800" cy="90" r="2.5"/>
  </g>
  <g stroke="#9a6700" stroke-width="1.2" opacity="0.35">
    <rect x="770" y="150" width="34" height="20" rx="2" fill="none"/>
    <line x1="770" y1="156" x2="762" y2="156"/>
    <line x1="770" y1="164" x2="762" y2="164"/>
    <line x1="804" y1="156" x2="812" y2="156"/>
    <line x1="804" y1="164" x2="812" y2="164"/>
  </g>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="34" rx="14" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <rect x="1" y="18" width="898" height="17" fill="#eaeef2"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" font-size="12" fill="#57606a" text-anchor="middle">prayogi@github: ~</text>

  <!-- terminal content -->
  <text x="28" y="76" font-size="17">
    <tspan fill="#1a7f37">prayogi@github</tspan><tspan fill="#57606a">:~$ </tspan><tspan fill="#24292f">whoami</tspan>
  </text>
  <text x="28" y="104" font-size="17" fill="#0969da">&gt; afprayogi — code that ships, circuits that spark</text>

  <text x="28" y="148" font-size="17">
    <tspan fill="#1a7f37">prayogi@github</tspan><tspan fill="#57606a">:~$ </tspan><tspan fill="#24292f">status</tspan>
  </text>
  <text x="28" y="176" font-size="17" fill="#57606a">&gt; building things that probably shouldn't exist yet</text>
  <rect x="547" y="163" width="10" height="17" fill="#24292f">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
